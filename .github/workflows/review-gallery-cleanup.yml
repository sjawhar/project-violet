name: review gallery cleanup

# When a PR closes, merged or not, remove its review gallery from gh-pages (review/pr-<n>/).
# Thumbnails in PR descriptions keep working: they point at the gh-pages commit that held them.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # preview pushes from its own cache clone, so the token goes in the global git config rather than the checkout's.
      - name: Git identity and credentials
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

      - name: Remove review/pr-${{ github.event.pull_request.number }}/ from gh-pages
        run: uv run --locked --project tools/preview preview unpublish "${{ github.event.pull_request.number }}"
