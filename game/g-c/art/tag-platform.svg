<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- THROWAWAY bake-off lane G-C: tag-platform, hand-written flat vector. The same sandstone slab as platform-tile (a
     dusted cap with block joints, a shadow under the lip, a stratum in the body) as a floating ledge with a rough
     underside, drawn in neutral light grays so the reveal shader tints it #e04a3a / #3fbf6a once acquired. The game
     shows one 256 px row per cell, so the same ledge band repeats four times; each band spans four cells and tiles
     horizontally. Transparent under the ledge. -->
