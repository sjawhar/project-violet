<!-- THROWAWAY bake-off lane G-C: lip-top, hand-written flat vector. An uneven sand lip laid along an open block top
     (art/vector_art.gd), so the top edge is not a ruler line: soft humps rise a few pixels above the collision line
     and a darker rim tucks under it. y=48 sits on the cell top; x=0 and x=256 meet at the same height, so lips chain
     seamlessly along a row. Transparent above the humps. -->
