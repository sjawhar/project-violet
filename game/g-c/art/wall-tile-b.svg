<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- THROWAWAY bake-off lane G-C: wall-tile-b, hand-written flat vector. A variant of wall-tile placed at random per
     4x4-cell block (art/vector_art.gd): the same layered sandstone with the same band heights where it meets the
     block edges (x=0 and x=1024, every 256 px), different band waves inside, a long hairline crack and a few small
     pebbles instead of the violet squiggles. Seamless both ways and with wall-tile and wall-tile-c. -->
<defs>
<g id="band">
<path fill="#8e5a38" d="M0,118 L120,126 L280,112 L460,128 L640,114 L800,126 L920,110 L1024,118 L1024,164 L900,158 L760,172 L600,160 L420,174 L260,160 L120,170 L0,164 Z"/>
<path fill="#c2875a" d="M0,206 L160,212 L380,202 L600,212 L820,200 L1024,206 L1024,222 L830,216 L600,228 L380,218 L160,226 L0,222 Z"/>
</g>
</defs>
<rect width="1024" height="1024" fill="#a86f46"/>
<use href="#band"/>
<use href="#band" transform="translate(1024 256) scale(-1 1)"/>
<use href="#band" transform="translate(512 512)"/>
<use href="#band" transform="translate(-512 512)"/>
<use href="#band" transform="translate(1536 768) scale(-1 1)"/>
<use href="#band" transform="translate(512 768) scale(-1 1)"/>
<path fill="#7a4a2e" d="M820,300 L832,360 L824,420 L838,470 L830,472 L816,420 L824,362 L812,302 Z"/>
<path fill="#8e5a38" d="M140,832 L380,826 L520,834 L516,842 L380,836 L142,840 Z"/>
<ellipse fill="#8e5a38" cx="786" cy="192" rx="20" ry="11"/>
<ellipse fill="#c2875a" cx="782" cy="186" rx="20" ry="11"/>
<ellipse fill="#8e5a38" cx="96" cy="460" rx="14" ry="8"/>
<ellipse fill="#c2875a" cx="93" cy="455" rx="14" ry="8"/>
</svg>
