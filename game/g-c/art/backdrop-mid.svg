<!-- THROWAWAY bake-off lane G-C: backdrop-mid, hand-written vector. Layered sandstone mesas, a butte, a wind-cut arch,
     a spire and a hoodoo cluster in hazy rock tones: shadow-violet shade sides away from the low sun on the left, a
     warm rim on the sunward edges, and haze that thickens toward the plain. 3072 px wide, so one screen never shows
     the same art twice. Transparent above so the far sky shows (also through the arch); seamless horizontally (the
     plain meets itself flat at the edges, the rocks stay inside). -->
