[project]
name = "bakeoff"
version = "0.1.0"
description = "THROWAWAY Phase 1 bake-off tooling: lane log check, decision rule, judging gallery, results table"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.23",
    # jsonschema checks "format": "date-time" and "uri" only when these are installed.
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
