[project]
name = "greybox"
version = "0.1.0"
description = "Validates and renders a violet-greybox level (docs/bakeoff/greybox-format.md). THROWAWAY bake-off tooling."
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
]

[project.scripts]
greybox = "greybox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
