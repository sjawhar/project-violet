[project]
name = "provenance"
version = "0.1.0"
description = "Provenance records for Violet's shipped assets, the Steam AI-disclosure report, and the LFS pointer check"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    # jsonschema checks "format": "date-time" and "uri" only when these are installed.
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
]

[project.scripts]
provenance = "provenance.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
