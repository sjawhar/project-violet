[project]
name = "preview"
version = "0.1.0"
description = "Review previews for Violet's assets: PR thumbnails and a GitHub Pages gallery"
requires-python = ">=3.12"
dependencies = ["provenance"]

[project.scripts]
preview = "preview.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
provenance = { path = "../provenance", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
